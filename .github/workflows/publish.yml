name: Publish CRM demo

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static demo
        run: touch .nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
